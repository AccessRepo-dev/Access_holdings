version: 2

sources:
  - name: wagway_hubspot_raw
    database: wagway_raw     
    schema: hubspot        
    tables:
      - name: COMPANY
      - name: USERS
      - name: DEAL
      - name: DEAL_PIPELINE
      - name: LINE_ITEM
