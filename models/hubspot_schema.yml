version: 2

sources:
  - name: wagway_hubspot_raw
    database: wagway_raw     
    schema: hubspot        
    tables:
      - name: COMPANY
        <<: &freshness_hubspot_defaults
          loaded_at_field: _FIVETRAN_SYNCED
          config:
            freshness:
              warn_after:
                count: 24
                period: hour
              error_after:
                count: 36
                period: hour

      - name: USERS
        <<: *freshness_hubspot_defaults

      - name: DEAL
        <<: *freshness_hubspot_defaults

      - name: DEAL_PIPELINE
        <<: *freshness_hubspot_defaults

