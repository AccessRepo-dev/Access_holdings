      - name: GL_ACCT_GRP_MEMBER
        <<: *freshness_sage_defaults

      - name: GL_BATCH
        <<: *freshness_sage_defaults

      - name: GL_BUDGET_HEADER
        <<: *freshness_sage_defaults

      - name: GL_BUDGET_ITEM
        <<: *freshness_sage_defaults

      - name: GL_COA_CAT_MEMBER
        <<: *freshness_sage_defaults

      - name: GL_DETAIL
        <<: *freshness_sage_defaults

      - name: GL_ENTRY
        <<: *freshness_sage_defaults

      - name: GLACCTGRPHIERARCHY
