version: 2

sources:
  - name: spotless_sage_raw
    database: spotless_raw
    schema: sage
    tables:
      - name: ASSET
        <<: &freshness_sage_defaults
          config:
            loaded_at_field: _FIVETRAN_SYNCED
            freshness:
              warn_after:
                count: 24
                period: hour
              error_after:
                count: 36
                period: hour

      - name: BANKACCOUNT
        <<: *freshness_sage_defaults

      - name: CLASS
        <<: *freshness_sage_defaults

      - name: CURRENCY
        <<: *freshness_sage_defaults

