version: 2

sources:
  - name: zeus_salesforce_raw
    database: zeus_raw     
    schema: salesforce        
    tables:
      - name: ACCOUNT
        <<: &freshness_salesforce_defaults
          loaded_at_field: _FIVETRAN_SYNCED
          config:
            freshness:
              warn_after:
                count: 24
                period: hour
              error_after:
                count: 36
                period: hour

      - name: OPPORTUNITY
        <<: *freshness_salesforce_defaults

      - name: USER
        <<: *freshness_salesforce_defaults

      - name: OPPORTUNITY_LINE_ITEM
        <<: *freshness_salesforce_defaults

      - name: PRODUCT_2
        <<: *freshness_salesforce_defaults

      - name: USER_ROLE
        <<: *freshness_salesforce_defaults

      - name: RECORD_TYPE
        <<: *freshness_salesforce_defaults

      - name: CAMPAIGN
        <<: *freshness_salesforce_defaults

      - name: CASE
        <<: *freshness_salesforce_defaults

      - name: CONTACT
        <<: *freshness_salesforce_defaults

      - name: LEAD
        <<: *freshness_salesforce_defaults

      - name: QUOTE
        <<: *freshness_salesforce_defaults

      - name: QUOTE_LINE_ITEM
        <<: *freshness_salesforce_defaults

      - name: TASK
        <<: *freshness_salesforce_defaults


   


  - name: zeus_snapshots
    database: zeus_raw  
    schema: SALESFORCE_SNAPSHOTS        
    tables:
      - name: SALESFORCE_ACCOUNT
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_OPPORTUNITY
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_OPPORTUNITY_LINE_ITEM
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_PRODUCT_2
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_RECORD_TYPE
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_USER
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_USER_ROLE
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_QUOTE
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_CAMPAIGN
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_CASE
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_LEAD
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_TASK
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_CONTACT
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_QUOTE_LINE_ITEM
        <<: *freshness_salesforce_defaults


  - name: zeus_silver
    database: "{{ env_var('DBT_ZEUS') }}"     
    schema: SILVER        
    tables:
      - name: SALESFORCE_CASE
        <<: *freshness_salesforce_defaults

      - name: SALESFORCE_PRODUCT
      - name: SALESFORCE_ACCOUNT
      - name: SALESFORCE_USER
      - name: SALESFORCE_CONTACT
      - name: SALESFORCE_LEAD
      - name: SALESFORCE_OPPORTUNITY_LINE_ITEM
      - name: SALESFORCE_USER_ROLE
      - name: SALESFORCE_OPPORTUNITY
      - name: SALESFORCE_QUOTE
      - name: SALESFORCE_RECORD_TYPE
      - name: SALESFORCE_TASK
      - name: SALESFORCE_CAMPAIGN
      - name: SALESFORCE_QUOTE_LINE_ITEM
      - name: zeus_OPPORTUNITY_STAGE_MAPPING


  - name: zeus_gold
    database: "{{ env_var('DBT_ZEUS') }}"     
    schema: GOLD        
    tables:
    - name: SALESFORCE_FACT_OPPORTUNITY
    - name: SALESFORCE_DIM_OPPORTUNITY