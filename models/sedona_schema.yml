version: 2

sources:
  
  - name: zeus_silver
    database: "{{ env_var('DBT_ZEUS') }}"
    schema: silver
    tables:
      - name: sedona_coa
        <<: &freshness_sedona_defaults
          config:
            loaded_at_field: _FIVETRAN_SYNCED
            freshness:
              warn_after:
                count: 24
                period: hour
              error_after:
                count: 36
                period: hour

      - name: sedona_adjustments
        <<: *freshness_sedona_defaults
      
  - name: zeus_gold
    database: "{{ env_var('DBT_ZEUS') }}"
    schema: gold
    tables:
      - name: dim_period
  
  