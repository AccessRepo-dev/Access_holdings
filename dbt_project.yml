
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'Access_Holdings'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

vars:
  companies:
    - name: 'WAGWAY'
      db: "{{ env_var('DBT_WAGWAY') }}"
      source: 'NETSUITE'
    - name: 'PLAYFLY'
      db: "{{ env_var('DBT_PLAYFLY') }}"
      source: 'NETSUITE'
    - name: 'SPOTLESS'
      db: "{{ env_var('DBT_SPOTLESS') }}"
      source: 'SAGE'
    - name: 'AMH'
      db: "{{ env_var('DBT_AMH') }}"
      source: 'SAGE'

  derived_metrics:
    - 'Gross Profit'
    - 'Gross Margin'
    - 'EBITDA'
    - 'EBITDA Margin'
    - 'Field EBITDA'
    - 'Field EBITDA Margin'
    - 'Post Corporate EBITDA'
    - 'Post Corporate EBITDA Margin'
    - 'Net Income'
    - 'Adjusted EBITDA'
    - 'Adjustments'
    - 'Total Liabilities & Equity'
    - 'Equity'
    - 'Total Assets'
    - 'Total Liabilities'
    - 'Lender EBITDA'
    - 'Pro Forma EBITDA'
    - 'Lender Adjustments'
    - 'Pro Forma Adjustments'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

models:
  +materialized: table
  +transient: false
  +pre-hook:
    - "insert into PIPELINE_AUDIT_DB.AUDIT_SCHEMA.PIPELINE_AUDIT_LOGS
        (PORTCO, SOURCE_SYSTEM,USER_NAME,DESTINATION_DB,DESTINATION_SCHEMA, TABLE_NAME, PIPELINE_TYPE, STATUS, STARTTIME)
     values
        ('{{ var('company','unknown') }}',
         '{{ var('sourcesystem','unknown') }}',
         CURRENT_USER(),
         '{{ this.database }}',
         '{{ this.schema }}',
         '{{ this.name }}',
         'dbt_transform',
         'STARTED',
         current_timestamp()
        )"
  +post-hook:
    - "update PIPELINE_AUDIT_DB.AUDIT_SCHEMA.PIPELINE_AUDIT_LOGS
       set
         STATUS = 'SUCCESS',
         ENDTIME = current_timestamp(),
         RUN_TIME = datediff('second', STARTTIME, current_timestamp()),
         ROWCOUNT = (select count(*) from {{ this }})
       where ID = (
         select max(ID)
         from PIPELINE_AUDIT_DB.AUDIT_SCHEMA.PIPELINE_AUDIT_LOGS
         where TABLE_NAME = '{{ this.name }}'
           and STATUS = 'STARTED'
       )"
  Access_Holdings:
    
    consolidated:
      gold:
        +database:  "{{ env_var('DBT_CONSOLIDATED', 'consolidated_dev') }}"
        +schema: GOLD
        +materialized: table
      reporting:
        +database:  "{{ env_var('DBT_CONSOLIDATED', 'consolidated_dev') }}"
        +schema: GOLD
        +materialized: table
    
    integrations:
      silver:
        netsuite:
          +schema: SILVER
          +materialized: table
        sage:
          +schema: SILVER
          +materialized: table
        macro: 
        +database: "{{env_var('DBT_ACCESS')}}"
        +schema: SILVER
        +materialized: table

      gold:
        netsuite:
          +schema: GOLD
          +materialized: table 
        sage:
          +schema: GOLD
          +materialized: table
        macro:
          +database: "{{env_var('DBT_ACCESS')}}"
          +schema: GOLD
          +materialized: table

      reporting:
        netsuite:
          +schema: GOLD
          +materialized: table 
        sage:
          +schema: GOLD
          +materialized: table

seeds:
  Access_Holdings:
    netsuite:
      +database: "{{ env_var('DBT_' ~ var('company','NONE') | upper, var('company','none') ~ '_dev') }}"
      +schema: SILVER
    sage:
      +database: "{{ env_var('DBT_' ~ var('company','NONE') | upper, var('company','none') ~ '_dev') }}"
      +schema: SILVER
       
on-run-end:
  - "{{ audit_failures(results) }}"