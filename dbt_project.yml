
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'Access_Holdings'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

vars:
  companies:
    - name: 'WAGWAY'
      db: "{{ env_var('DBT_WAGWAY') }}"
      source: 'NETSUITE'
    - name: 'PLAYFLY'
      db: "{{ env_var('DBT_PLAYFLY') }}"
      source: 'NETSUITE'
    - name: 'SPOTLESS'
      db: "{{ env_var('DBT_SPOTLESS') }}"
      source: 'SAGE'
    - name: 'AMH'
      db: "{{ env_var('DBT_AMH') }}"
      source: 'SAGE'
    - name: 'ZEUS'
      db: "{{ env_var('DBT_ZEUS') }}"
      source: 'SEDONA'

  derived_metrics:
    - 'Gross Profit'
    - 'Gross Margin'
    - 'Store EBITDA'
    - 'Store EBITDA Margin'
    - 'Field EBITDA'
    - 'Field EBITDA Margin'
    - 'Post Corporate EBITDA'
    - 'Post Corporate EBITDA Margin'
    - 'Net Income'
    - 'Adjusted EBITDA'
    - 'Adjustments'
    - 'Total Liabilities & Equity'
    - 'Equity'
    - 'Total Assets'
    - 'Total Liabilities'
    - 'Lender EBITDA'
    - 'Pro Forma EBITDA'
    - 'Lender Adjustments'
    - 'Pro Forma Adjustments'
    - 'Gross Revenue'
    - 'Cash EBITDA'
    - 'Signing Bonus Amortization'
    - 'Cash EBITDA Margin'
    - 'Operating Profit'
    - 'Adjusted EBITDA TTM'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.
models:
  elementary:
    +database: PIPELINE_AUDIT_DB
    +schema: ELEMENTARY


  +materialized: table
  +transient: false
  Access_Holdings:
    
    consolidated:
      gold:
        +database:  "{{ env_var('DBT_CONSOLIDATED', 'consolidated_dev') }}"
        +schema: GOLD
        +materialized: table
      reporting:
        +database:  "{{ env_var('DBT_CONSOLIDATED', 'consolidated_dev') }}"
        +schema: GOLD
        +materialized: table
    
    integrations:
      silver:
        netsuite:
          +schema: SILVER
          +materialized: table
        sage:
          +schema: SILVER
          +materialized: table
        macro: 
          +database: "{{env_var('DBT_ACCESS')}}"
          +schema: SILVER
          +materialized: table
        hubspot:
            +schema: SILVER
            +materialized: table
        salesforce:
            +schema: SILVER
            +materialized: table
        ringcentral:
            +schema: SILVER
            +materialized: table
        gingr:
            +schema: SILVER
            +materialized: table
        ukg_pro:
            +schema: SILVER
            +materialized: table
        ukg_ready:
            +schema: SILVER
            +materialized: table
        adp_workforce_now:
            +schema: SILVER
            +materialized: table



      gold:
        netsuite:
          +schema: GOLD
          +materialized: table 
        sage:
          +schema: GOLD
          +materialized: table
        sedona:
          +schema: GOLD
          +materialized: table
        macro:
          +database: "{{env_var('DBT_ACCESS')}}"
          +schema: GOLD
          +materialized: table
        salesforce:
          +schema: GOLD
          +materialized: table
        hubspot:
          +schema: GOLD
        wagway_multisource_models:
            +schema: GOLD
            +materialized: table 
        ukg_pro:
            +schema: GOLD
            +materialized: table
        adp_workforce_now:
            +schema: GOLD
            +materialized: table
        ukg_ready:
            +schema: GOLD
            +materialized: table
     
      reporting:
        netsuite:
          +schema: GOLD
          +materialized: table 
        sage:
          +schema: GOLD
          +materialized: table
      streamlit_staging:
        +database: STREAMLIT_APPS
        +schema: FINMAP_DEV
        +materialized: table

seeds:
  Access_Holdings:
    netsuite:
      +database: "{{ env_var('DBT_' ~ var('company','NONE') | upper, var('company','none') ~ '_dev') }}"
      +schema: SILVER
    sage:
      +database: "{{ env_var('DBT_' ~ var('company','NONE') | upper, var('company','none') ~ '_dev') }}"
      +schema: SILVER
    salesforce:
      +database: "{{ env_var('DBT_' ~ var('company','NONE') | upper, var('company','none') ~ '_dev') }}"
      +schema: SILVER
    hubspot:
      +database: "{{ env_var('DBT_' ~ var('company','NONE') | upper, var('company','none') ~ '_dev') }}"
      +schema: SILVER
    access:
      +database: "{{ env_var('DBT_' ~ var('company','NONE') | upper, var('company','none') ~ '_dev') }}"
      +schema: SILVER
    adp_workforce_now:
      +database: "{{ env_var('DBT_' ~ var('company','NONE') | upper, var('company','none') ~ '_dev') }}"
      +schema: SILVER

    macro_economic:
      +database: "{{env_var('DBT_ACCESS')}}"
      +schema: SILVER
